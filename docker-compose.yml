services:
  redis:
    image: redis:8
    # AOF + volumen: los checkpoints de AsyncRedisSaver sobreviven a restart y a down/up (sin -v).
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  phoenix:
    image: arizephoenix/phoenix:version-20.23.0
    ports:
      - "6006:6006"
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix-data:/mnt/data

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      PHOENIX_ENDPOINT: http://phoenix:6006/v1/traces
      PHOENIX_PROJECT: intelligence
      WORKER_IN_API: "0"
    depends_on:
      redis:
        condition: service_healthy
      phoenix:
        condition: service_started

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      PHOENIX_ENDPOINT: http://phoenix:6006/v1/traces
      PHOENIX_PROJECT: intelligence
    depends_on:
      redis:
        condition: service_healthy
      phoenix:
        condition: service_started

volumes:
  redis-data:
  phoenix-data:
