[project]
name = "coder-entrega-final"
version = "1.0.0"
description = "Sistema de IA: RAG hibrido, supervisor, API y trazas."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["main.py", "app", "agents", "rag.py", "modelo.py", "state.py", "errors.py", "requisitos.py"]
exclude = ["^\\.venv/"]
